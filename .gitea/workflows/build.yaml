name: Building ${{ gitea.repository }}
run-name: ${{ gitea.actor }} is building ${{ gitea.repository }}
on:
  push:
    branches: [main]
jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@v4
        with:
          registry: http://${{ vars.REGISTRY_HOST }}
          username: ${{ gitea.actor }}
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: network=host
          buildkitd-config-inline: |
            [registry."${{ vars.REGISTRY_HOST }}"]
              http = true
              insecure = true

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ vars.REGISTRY_HOST }}/${{ gitea.repository_owner }}/${{ gitea.event.repository.name }}:latest
          cache-from: type=registry,ref=${{ vars.REGISTRY_HOST }}/${{ gitea.repository_owner }}/${{ gitea.event.repository.name }}:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY_HOST }}/${{ gitea.repository_owner }}/${{ gitea.event.repository.name }}:buildcache,mode=max

  Deploy:
    runs-on: ubuntu-latest
    needs: Build
    steps:
      - name: Pull Image
        run: |
          docker pull ${{ vars.REGISTRY_HOST }}/${{ gitea.repository_owner }}/${{ gitea.event.repository.name }}:latest

      - name: Stop Container
        run: |
          docker stop ${{ gitea.event.repository.name }} || true

      - name: Remove Container
        run: |
          docker rm ${{ gitea.event.repository.name }} || true

      - name: Run Container
        env:
          APP_JWT_SECRET: ${{ secrets.APP_JWT_SECRET }}
          APP_DB_PASSWORD: ${{ secrets.WPU_STAFF_CLEARANCE_DB_PASSWORD }}
        run: |
          docker run \
            -d \
            --name ${{ gitea.event.repository.name }} \
            --add-host host.docker.internal=host-gateway \
            --restart unless-stopped \
            -p 3023:3000 \
            -e APP_JWT_SECRET="$APP_JWT_SECRET" \
            -e APP_DB_PASSWORD="$APP_DB_PASSWORD" \
            ${{ vars.REGISTRY_HOST }}/${{ gitea.repository_owner }}/${{ gitea.event.repository.name }}:latest
